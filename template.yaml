AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: An AWS Serverless Application Model for transcribing audio to docx.

Metadata:
  S3Defaults:
    PublicAccessBlock: &PublicAccessBlock
      BlockPublicAcls: true
      BlockPublicPolicy: true
      IgnorePublicAcls: true
      RestrictPublicBuckets: true
    BucketGuard: &BucketGuard
      Guard:
        SuppressedRules:
          - S3_BUCKET_LOGGING_ENABLED
          - S3_BUCKET_VERSIONING_ENABLED
          - S3_BUCKET_SERVER_SIDE_ENCRYPTION_ENABLED
          - S3_DEFAULT_ENCRYPTION_KMS
  DownloadBucketName: &DownloadBucketName !Sub "${AWS::AccountId}-${AWS::Region}-download-bucket"
  UploadBucketName: &UploadBucketName !Sub "${AWS::AccountId}-${AWS::Region}-upload-bucket"

Globals:
  Function:
    Runtime: python3.11
    Handler: app.lambda_handler

Parameters:
  MaxSpeakers:
    Type: Number
  CommonFilename:
    Type: String

Resources:
  RunTranscriptionJob:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/transcribe/
      Description: 'Runs a transcription job'
      MemorySize: 128
      Timeout: 15
      LoggingConfig:
        LogFormat: JSON
        LogGroup: /aws/lambda/sam-transcribe-RunTranscriptionJob
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 21600
        MaximumRetryAttempts: 2
      Environment:
        Variables:
          MAX_SPEAKERS: !Ref MaxSpeakers
          DOWNLOAD_BUCKET_NAME: !Ref DownloadBucket
      Policies:
        - AWSLambdaBasicExecutionRole
        - AmazonTranscribeFullAccess
        - S3FullAccessPolicy:
            BucketName: *DownloadBucketName
        - S3FullAccessPolicy:
            BucketName: *UploadBucketName
      Events:
        AudioUploaded:
          Type: S3
          Properties:
            Bucket: !Ref UploadBucket
            Events:
              - s3:ObjectCreated:*

  ConvertToDocx:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/convert/
      Description: 'Converts a transcribed JSON file into docx'
      MemorySize: 1024
      Timeout: 480
      LoggingConfig:
        LogFormat: JSON
        LogGroup: /aws/lambda/sam-transcribe-ConvertToDocx
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 21600
        MaximumRetryAttempts: 2
      Environment:
        Variables:
          MPLCONFIGDIR: !Sub "/tmp/matplotlib-{AWS::StackName}"
          COMMON_FILENAME: !Ref CommonFilename
      Policies:
        - AWSLambdaBasicExecutionRole
        - S3FullAccessPolicy:
            BucketName: *DownloadBucketName
      Events:
        JSONCreated:
          Type: S3
          Properties:
            Bucket: !Ref DownloadBucket
            Events:
              - s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: transcribed/
                  - Name: suffix
                    Value: .json

  DownloadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: *DownloadBucketName
      LifecycleConfiguration:
        Rules:
          # TODO: configurable expiration
          - ExpirationInDays: 5
            Id: ExpirationRule
            Status: Enabled
      PublicAccessBlockConfiguration: *PublicAccessBlock
    Metadata: *BucketGuard

  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: *UploadBucketName
      LifecycleConfiguration:
        Rules:
          # TODO: configurable expiration
          - ExpirationInDays: 1
            Id: ExpirationRule
            Status: Enabled
      PublicAccessBlockConfiguration: *PublicAccessBlock
    Metadata: *BucketGuard

Outputs:
  RunTranscriptionJobArn:
    Description: "Transcription job runner"
    Value: !Ref RunTranscriptionJob
  ConvertToDocxArn:
    Description: "Function which converts JSON into docx"
    Value: !Ref ConvertToDocx
  DownloadBucketArn:
    Description: "Bucket for downloading transcriptions"
    Value: !Ref DownloadBucket
  UploadBucketArn:
    Description: "Bucket for uploading audio files"
    Value: !Ref UploadBucket